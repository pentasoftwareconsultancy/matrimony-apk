# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Create environment files
        run: |
          cat << 'EOF' > .env.development
          APP_ENV=development
          API_BASE_URL=http://localhost:8000
          SOCKET_URL=http://localhost:8000/api
          EOF
          cat << 'EOF' > .env.production
          APP_ENV=production
          API_BASE_URL=https://matrimony-apk-1.onrender.com
          SOCKET_URL=https://matrimony-apk-1.onrender.com/api
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Flutter Web
        run: flutter build web --release --no-wasm-dry-run

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MATRIMONY_APK_9895 }}
          projectId: matrimony-apk-9895
